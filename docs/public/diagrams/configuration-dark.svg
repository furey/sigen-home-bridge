<rect x="240" y="330" width="100" height="28" rx="8" fill="#38bdf8" fill-opacity="0.85"/><text x="290" y="318" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">every 2 s</text>
<rect x="465" y="330" width="100" height="28" rx="8" fill="#a78bfa" fill-opacity="0.85"/><text x="515" y="318" font-size="13" font-weight="600" fill="#a78bfa" text-anchor="middle">every 10 s</text>
<text x="140" y="318" font-size="13" font-weight="400" fill="#98989f" text-anchor="middle">default: every 5 s</text>
