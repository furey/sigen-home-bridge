<text x="602.5" y="318" font-size="13" font-weight="400" fill="#98989f" text-anchor="middle">5 s</text>
<text x="40" y="380" font-size="12" font-weight="400" fill="#6a6a71" text-anchor="start">00:00</text>
<text x="190" y="380" font-size="12" font-weight="400" fill="#6a6a71" text-anchor="middle">06:00</text>
