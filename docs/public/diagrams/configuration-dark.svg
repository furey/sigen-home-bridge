<rect x="40" y="104" width="600" height="46" rx="12" fill="#202127"/><g transform="translate(58 118) scale(0.75)" fill="none" stroke="#98989f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z" /> <circle cx="16.5" cy="7.5" r=".5" fill="currentColor" /></g><text x="90" y="132" font-size="14" font-weight="600" fill="#dfdfd6" text-anchor="start">.env</text><text x="622" y="132" font-size="13" font-weight="400" fill="#98989f" text-anchor="end">seeds the first boot only</text>
<rect x="40" y="158" width="600" height="46" rx="12" fill="#202127"/><g transform="translate(58 172) scale(0.75)" fill="none" stroke="#98989f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5H3" /> <path d="M16 12H3" /> <path d="M11 19H3" /> <path d="m15 18 2 2 4-4" /></g><text x="90" y="186" font-size="14" font-weight="600" fill="#dfdfd6" text-anchor="start">Built-in defaults</text><text x="622" y="186" font-size="13" font-weight="400" fill="#98989f" text-anchor="end">used when nothing else is set</text>
<text x="40" y="268" font-size="15" font-weight="600" fill="#dfdfd6" text-anchor="start">When the bridge polls</text>
