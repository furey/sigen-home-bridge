<text x="640" y="380" font-size="12" font-weight="400" fill="#6a6a71" text-anchor="end">24:00</text>
<text x="340" y="420" font-size="13" font-weight="400" fill="#98989f" text-anchor="middle">Each cycle checks the clock, uses that window's interval, then waits.</text>
